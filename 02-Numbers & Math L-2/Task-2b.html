<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Basics</title><!-- as we are practising with CSS title would be CSS basics -->
</head>
<body>
<!-- HTML for Amazon Button -->
<button class="amazon-button">Add to Cart</button>

<!-- CSS for Amazon Button -->
<style>
.amazon-button {
    background-color: rgb(255, 216, 20); /* Sets the background color to yellow */
    color: black; /* Sets the text color to black */
    border: none; /* Removes the border */
    padding: 10px 20px; /* Adds space inside the button */
    font-size: 16px; /* Sets the text size */
    border-radius: 20px; /* Rounds the corners of the button */
    cursor: pointer; /* Changes the cursor to a pointer when hovering */
}
</style>
</body>
</html>
